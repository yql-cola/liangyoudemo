spring:
  application:
    name: liangyoudemo
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      config:
        import-check:
          enabled: false

server:
  port: 18088

app:
  swagger:
    global-headers:
      - X-Tenant-Id
      - X-Trace-Id

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-dynamic-parameter: true
